<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lottie Mask Playground</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f4;
      color: #17171f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) 380px;
      gap: 28px;
      min-height: 100vh;
      padding: 28px;
    }

    .preview {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 56px);
      background: #fff;
      border: 1px solid #e9e7df;
    }

    .stage {
      position: relative;
      width: min(720px, 70vw);
      aspect-ratio: 1 / 1;
    }

    #lottie-visible,
    #image-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #lottie-visible svg,
    #image-stage {
      display: block;
    }

    #lottie-mask-source {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .controls {
      align-self: start;
      display: grid;
      gap: 14px;
      padding: 18px;
      background: #fff;
      border: 1px solid #e1ded5;
      max-height: calc(100vh - 56px);
      overflow: auto;
    }

    .controls h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 650;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      height: 36px;
      border: 1px solid #cac6bb;
      background: #f7f7f4;
      color: #17171f;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: #eeeeea; }

    fieldset {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 12px;
      border: 1px solid #e6e2da;
    }

    legend {
      padding: 0 6px;
      color: #62605a;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    label {
      display: grid;
      grid-template-columns: 1fr 56px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
    }

    output {
      justify-self: end;
      color: #62605a;
      font-variant-numeric: tabular-nums;
    }

    .readout {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      color: #62605a;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .readout span {
      padding: 8px;
      background: #f7f7f4;
      border: 1px solid #ebe8e0;
    }

    .error {
      color: #a33131;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
      }

      .preview {
        min-height: auto;
        aspect-ratio: 1 / 1;
      }

      .stage {
        width: min(720px, 92vw);
      }

      .controls {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="preview" aria-label="Lottie mask preview">
      <div class="stage">
        <div id="lottie-visible"></div>
        <svg id="image-stage" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <mask id="lottieMask" mask-type="alpha" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="900" height="900"></mask>
          </defs>
          <image id="img-1" x="228.25" y="228.25" width="443.5" height="443.5" preserveAspectRatio="xMidYMid slice" mask="url(#lottieMask)" opacity="0" />
          <image id="img-2" x="228.25" y="228.25" width="443.5" height="443.5" preserveAspectRatio="xMidYMid slice" mask="url(#lottieMask)" opacity="0" />
          <image id="img-3" x="228.25" y="228.25" width="443.5" height="443.5" preserveAspectRatio="xMidYMid slice" mask="url(#lottieMask)" opacity="0" />
        </svg>
        <div id="lottie-mask-source"></div>
      </div>
    </section>

    <aside class="controls">
      <h1>Lottie Mask Playground</h1>
      <div class="toolbar">
        <button type="button" id="play">Pause</button>
        <button type="button" id="restart">Restart</button>
        <button type="button" id="reset">Reset</button>
      </div>

      <div class="readout">
        <span>frame <strong id="frame-readout">0</strong> / 276</span>
        <span>opacity <strong id="opacity-readout">0 0 0</strong></span>
      </div>

      <fieldset>
        <legend>Presets</legend>
        <div class="preset-buttons">
          <button type="button" data-preset="current">Current</button>
          <button type="button" data-preset="demo">Demo HTML</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Playback</legend>
        <label>
          Speed
          <output for="speed">1.00</output>
          <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1">
        </label>
        <label>
          Scrub frame
          <output for="scrub">0</output>
          <input id="scrub" type="range" min="0" max="276" step="1" value="0">
        </label>
        <label>
          Max image opacity
          <output for="maxOpacity">1.00</output>
          <input id="maxOpacity" type="range" min="0" max="1" step="0.01" value="1">
        </label>
      </fieldset>

      <fieldset>
        <legend>Image 1</legend>
        <label>
          Fade in start
          <output for="img1InStart">70</output>
          <input id="img1InStart" type="range" min="0" max="276" step="1" value="70">
        </label>
        <label>
          Fade in end
          <output for="img1InEnd">85</output>
          <input id="img1InEnd" type="range" min="0" max="276" step="1" value="85">
        </label>
        <label>
          Fade out start
          <output for="img1OutStart">121</output>
          <input id="img1OutStart" type="range" min="0" max="276" step="1" value="121">
        </label>
        <label>
          Fade out end
          <output for="img1OutEnd">142</output>
          <input id="img1OutEnd" type="range" min="0" max="276" step="1" value="142">
        </label>
      </fieldset>

      <fieldset>
        <legend>Image 2</legend>
        <label>
          Fade in start
          <output for="img2InStart">142</output>
          <input id="img2InStart" type="range" min="0" max="276" step="1" value="142">
        </label>
        <label>
          Fade in end
          <output for="img2InEnd">164</output>
          <input id="img2InEnd" type="range" min="0" max="276" step="1" value="164">
        </label>
        <label>
          Fade out start
          <output for="img2OutStart">210</output>
          <input id="img2OutStart" type="range" min="0" max="276" step="1" value="210">
        </label>
        <label>
          Fade out end
          <output for="img2OutEnd">234</output>
          <input id="img2OutEnd" type="range" min="0" max="276" step="1" value="234">
        </label>
      </fieldset>

      <fieldset>
        <legend>Image 3</legend>
        <label>
          Fade in start
          <output for="img3InStart">234</output>
          <input id="img3InStart" type="range" min="0" max="276" step="1" value="234">
        </label>
        <label>
          Fade in end
          <output for="img3InEnd">254</output>
          <input id="img3InEnd" type="range" min="0" max="276" step="1" value="254">
        </label>
      </fieldset>

      <p class="error" id="error" hidden></p>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    (function initPlayground() {
      'use strict';

      var JSON_URL = 'introscreen-updated.json';
      var XLINK_NS = 'http://www.w3.org/1999/xlink';
      var DEFAULTS = {
        speed: 1,
        scrub: 0,
        maxOpacity: 1
      };
      var PRESETS = {
        current: {
          img1InStart: 70,
          img1InEnd: 85,
          img1OutStart: 121,
          img1OutEnd: 142,
          img2InStart: 142,
          img2InEnd: 164,
          img2OutStart: 210,
          img2OutEnd: 234,
          img3InStart: 234,
          img3InEnd: 254
        },
        demo: {
          img1InStart: 79,
          img1InEnd: 90,
          img1OutStart: 120,
          img1OutEnd: 140,
          img2InStart: 140,
          img2InEnd: 165,
          img2OutStart: 207,
          img2OutEnd: 234,
          img3InStart: 234,
          img3InEnd: 256
        }
      };
      Object.assign(DEFAULTS, PRESETS.current);

      var TIMING_CONTROL_IDS = [
        'img1InStart',
        'img1InEnd',
        'img1OutStart',
        'img1OutEnd',
        'img2InStart',
        'img2InEnd',
        'img2OutStart',
        'img2OutEnd',
        'img3InStart',
        'img3InEnd'
      ];

      var state = {
        playing: true,
        currentFrame: 0,
        visibleAnim: null,
        maskAnim: null
      };

      var imageUrls = [
        'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80',
        'https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=80'
      ];

      var controls = Object.keys(DEFAULTS).reduce(function(map, id) {
        map[id] = document.getElementById(id);
        return map;
      }, {});
      var imgEls = [
        document.getElementById('img-1'),
        document.getElementById('img-2'),
        document.getElementById('img-3')
      ];
      var playButton = document.getElementById('play');
      var restartButton = document.getElementById('restart');
      var resetButton = document.getElementById('reset');
      var frameReadout = document.getElementById('frame-readout');
      var opacityReadout = document.getElementById('opacity-readout');
      var errorEl = document.getElementById('error');

      imageUrls.forEach(function(url, index) {
        imgEls[index].setAttribute('href', url);
        imgEls[index].setAttributeNS(XLINK_NS, 'xlink:href', url);
      });

      function value(id) {
        return Number(controls[id].value);
      }

      function rules() {
        return [
          { inStart: value('img1InStart'), inEnd: value('img1InEnd'), outStart: value('img1OutStart'), outEnd: value('img1OutEnd') },
          { inStart: value('img2InStart'), inEnd: value('img2InEnd'), outStart: value('img2OutStart'), outEnd: value('img2OutEnd') },
          { inStart: value('img3InStart'), inEnd: value('img3InEnd'), outStart: Infinity, outEnd: Infinity }
        ];
      }

      function opacityAt(frame, rule) {
        var maxOpacity = value('maxOpacity');
        var inDuration = Math.max(1, rule.inEnd - rule.inStart);
        var outDuration = Math.max(1, rule.outEnd - rule.outStart);

        if (frame < rule.inStart) return 0;
        if (frame < rule.inEnd) return maxOpacity * ((frame - rule.inStart) / inDuration);
        if (frame < rule.outStart) return maxOpacity;
        if (frame < rule.outEnd) return maxOpacity * (1 - (frame - rule.outStart) / outDuration);
        return 0;
      }

      function setOutput(input) {
        var output = document.querySelector('output[for="' + input.id + '"]');
        if (!output) return;
        output.textContent = input.step && Number(input.step) < 1 ? Number(input.value).toFixed(2) : input.value;
      }

      function updateFrame(frame) {
        var roundedFrame = Math.max(0, Math.min(276, frame));
        var currentRules = rules();
        var opacities = currentRules.map(function(rule, index) {
          var opacity = opacityAt(roundedFrame, rule);
          imgEls[index].setAttribute('opacity', opacity.toFixed(3));
          return opacity;
        });

        state.currentFrame = roundedFrame;
        controls.scrub.value = Math.round(roundedFrame);
        setOutput(controls.scrub);
        frameReadout.textContent = Math.round(roundedFrame);
        opacityReadout.textContent = opacities.map(function(opacity) {
          return opacity.toFixed(2);
        }).join(' ');
      }

      function syncMask(frame) {
        if (state.maskAnim) state.maskAnim.goToAndStop(frame, true);
      }

      function handleControlInput(event) {
        setOutput(event.target);

        if (event.target.id === 'speed' && state.visibleAnim) {
          state.visibleAnim.setSpeed(value('speed'));
        }

        if (event.target.id === 'scrub') {
          state.playing = false;
          playButton.textContent = 'Play';
          state.visibleAnim.pause();
          state.visibleAnim.goToAndStop(value('scrub'), true);
          syncMask(value('scrub'));
          updateFrame(value('scrub'));
          return;
        }

        updateFrame(state.currentFrame);
      }

      function applyPreset(name) {
        var preset = PRESETS[name];
        if (!preset) return;

        TIMING_CONTROL_IDS.forEach(function(id) {
          controls[id].value = preset[id];
          setOutput(controls[id]);
        });
        updateFrame(state.currentFrame);
      }

      Object.keys(controls).forEach(function(id) {
        var control = controls[id];
        setOutput(control);
        control.addEventListener('input', handleControlInput);
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function(button) {
        button.addEventListener('click', function() {
          applyPreset(button.getAttribute('data-preset'));
        });
      });

      playButton.addEventListener('click', function() {
        state.playing = !state.playing;
        playButton.textContent = state.playing ? 'Pause' : 'Play';
        if (state.playing) state.visibleAnim.play();
        else state.visibleAnim.pause();
      });

      restartButton.addEventListener('click', function() {
        state.playing = true;
        playButton.textContent = 'Pause';
        state.visibleAnim.goToAndPlay(0, true);
        syncMask(0);
        updateFrame(0);
      });

      resetButton.addEventListener('click', function() {
        Object.keys(DEFAULTS).forEach(function(id) {
          controls[id].value = DEFAULTS[id];
          setOutput(controls[id]);
        });
        if (state.visibleAnim) state.visibleAnim.setSpeed(DEFAULTS.speed);
        updateFrame(state.currentFrame);
      });

      fetch(JSON_URL).then(function(response) {
        if (!response.ok) throw new Error('Could not load ' + JSON_URL);
        return response.json();
      }).then(function(data) {
        state.visibleAnim = lottie.loadAnimation({
          container: document.getElementById('lottie-visible'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: JSON.parse(JSON.stringify(data)),
          rendererSettings: { preserveAspectRatio: 'xMidYMid slice' }
        });

        state.maskAnim = lottie.loadAnimation({
          container: document.getElementById('lottie-mask-source'),
          renderer: 'svg',
          loop: true,
          autoplay: false,
          animationData: JSON.parse(JSON.stringify(data)),
          rendererSettings: { preserveAspectRatio: 'xMidYMid slice' }
        });

        state.visibleAnim.setSpeed(value('speed'));

        state.maskAnim.addEventListener('DOMLoaded', function() {
          var sourceSvg = document.querySelector('#lottie-mask-source svg');
          var maskEl = document.getElementById('lottieMask');
          if (!sourceSvg || !maskEl) return;

          Array.prototype.filter.call(sourceSvg.children, function(child) {
            return child.localName === 'g';
          }).forEach(function(group) {
            group.removeAttribute('clip-path');
            maskEl.appendChild(group);
          });
        });

        state.visibleAnim.addEventListener('enterFrame', function(event) {
          var frame = event.currentTime;
          syncMask(frame);
          updateFrame(frame);
        });
      }).catch(function(error) {
        errorEl.hidden = false;
        errorEl.textContent = error.message + '. Run this page from a local server, not directly as a file.';
      });
    })();
  </script>
</body>
</html>
