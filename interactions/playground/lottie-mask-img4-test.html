<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lottie-mask img-4 test</title>
  <link rel="stylesheet" href="../global/lottie-mask/lottie-mask.css">
  <style>
    body { margin: 0; background: #111; font-family: sans-serif; color: #eee; padding: 32px; }
    h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; opacity: .5; }
    .row { display: flex; gap: 48px; flex-wrap: wrap; margin-bottom: 64px; }
    .lottie-component { width: 320px; }
    #debug { position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,.75);
             padding: 10px 14px; font-size: 12px; line-height: 1.6; border-radius: 6px;
             min-width: 220px; font-family: monospace; }
    #debug b { color: #7df; }
  </style>
</head>
<body>

<div id="debug">
  <b>4-image instance</b><br>
  ready: <span id="s4">—</span><br>
  segment: <span id="seg">—</span><br>
  actual: <span id="af">—</span><br>
  virtual: <span id="vf">—</span><br>
  <br>
  <b>3-image instance</b><br>
  ready: <span id="s3">—</span>
</div>

<div class="row">
  <div>
    <h2>4-image (repeat mode)</h2>
    <div class="lottie-component">
      <div id="lm4"
        data-lottie-mask
        data-lottie-img-1="https://picsum.photos/seed/img1/600/600"
        data-lottie-img-2="https://picsum.photos/seed/img2/600/600"
        data-lottie-img-3="https://picsum.photos/seed/img3/600/600"
        data-lottie-img-4="https://picsum.photos/seed/img4/600/600">
        <img class="lottie-builder-placeholder" src="https://picsum.photos/seed/img4/600/600" alt="" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;">
      </div>
    </div>
  </div>

  <div>
    <h2>3-image (unchanged path)</h2>
    <div class="lottie-component">
      <div id="lm3"
        data-lottie-mask
        data-lottie-img-1="https://picsum.photos/seed/a1/600/600"
        data-lottie-img-2="https://picsum.photos/seed/a2/600/600"
        data-lottie-img-3="https://picsum.photos/seed/a3/600/600">
        <img class="lottie-builder-placeholder" src="https://picsum.photos/seed/a3/600/600" alt="" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;">
      </div>
    </div>
  </div>

  <div>
    <h2>empty img-4 → 3-image path</h2>
    <div class="lottie-component">
      <div id="lm4e"
        data-lottie-mask
        data-lottie-img-1="https://picsum.photos/seed/b1/600/600"
        data-lottie-img-2="https://picsum.photos/seed/b2/600/600"
        data-lottie-img-3="https://picsum.photos/seed/b3/600/600"
        data-lottie-img-4="   ">
        <img class="lottie-builder-placeholder" src="https://picsum.photos/seed/b3/600/600" alt="" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;">
      </div>
    </div>
  </div>
</div>

<!-- lottie-web — use same major version as production (5.x) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="../global/lottie-mask/lottie-mask.js"></script>

<script>
  // Hook into the 4-image instance's internal state for the debug panel.
  // We patch enterFrame after a tick so lottie-mask has already attached its listener.
  (function() {
    var lm4 = document.getElementById('lm4');
    var lm3 = document.getElementById('lm3');
    var s4el = document.getElementById('s4');
    var s3el = document.getElementById('s3');
    var segEl = document.getElementById('seg');
    var afEl = document.getElementById('af');
    var vfEl = document.getElementById('vf');

    // Watch ready attribute
    var obs4 = new MutationObserver(function() {
      s4el.textContent = lm4.getAttribute('data-lottie-mask-ready');
    });
    obs4.observe(lm4, { attributes: true, attributeFilter: ['data-lottie-mask-ready'] });

    var obs3 = new MutationObserver(function() {
      s3el.textContent = lm3.getAttribute('data-lottie-mask-ready');
    });
    obs3.observe(lm3, { attributes: true, attributeFilter: ['data-lottie-mask-ready'] });

    // Patch lottie.loadAnimation to intercept the visible animation for the 4-image instance
    var _load = lottie.loadAnimation.bind(lottie);
    var interceptNext = false;
    lottie.loadAnimation = function(cfg) {
      var anim = _load(cfg);
      if (cfg.container === lm4.querySelector && typeof cfg.container !== 'undefined') {
        // Check if this container belongs to lm4
        if (lm4.contains(cfg.container) && !cfg.container.classList.contains('lm-mask-source')) {
          anim.addEventListener('enterFrame', function(e) {
            var actual = (anim.firstFrame || 0) + e.currentTime;
            var SEG_A = 100;
            var SEG_B = 186;
            var REPEAT_OFFSET = SEG_B - SEG_A;
            var virtual = actual + (anim.firstFrame > 0 ? REPEAT_OFFSET : 0);
            segEl.textContent = anim.firstFrame > 0 ? '2' : '1';
            afEl.textContent = actual.toFixed(1);
            vfEl.textContent = virtual.toFixed(1);
          });
        }
      }
      return anim;
    };
  })();
</script>
</body>
</html>
